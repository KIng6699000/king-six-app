<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D / 3D Master & Agent System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans p-4 min-h-screen">

    <div id="app"></div>

    <script>
        // ==========================================
        // သင့်ရဲ့ Firebase Config အချက်အလက်များ
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyC6Gpq-jvL5z463VmBlkPngJy1Nv3hyWHA",
            authDomain: "king-six-project.firebaseapp.com",
            projectId: "king-six-project",
            storageBucket: "king-six-project.appspot.com",
            messagingSenderId: "797839158583",
            appId: "1:797839158583:web:28c5a78ebfd6b78dfabeb2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('app').innerHTML = `
            <div class="max-w-4xl mx-auto space-y-4">
                <div class="bg-slate-800 p-4 rounded-xl shadow-md flex justify-between items-center">
                    <h1 class="text-lg font-bold text-amber-400">📊 2D / 3D ဒိုင် & ကော်မရှင် စနစ်</h1>
                    <div class="space-x-2">
                        <button onclick="setRole('master')" id="btnMaster" class="px-3 py-1 bg-indigo-600 rounded text-xs font-bold">👑 ဒိုင်ချုပ်</button>
                        <button onclick="setRole('agent')" id="btnAgent" class="px-3 py-1 bg-slate-700 rounded text-xs font-bold">💼 ကော်မရှင်</button>
                    </div>
                </div>
                <div id="mainContent" class="bg-slate-800 p-6 rounded-xl shadow-md"></div>
            </div>
        `;

        function setRole(role) {
            const content = document.getElementById('mainContent');
            if (role === 'master') {
                document.getElementById('btnMaster').className = "px-3 py-1 bg-indigo-600 rounded text-xs font-bold";
                document.getElementById('btnAgent').className = "px-3 py-1 bg-slate-700 rounded text-xs font-bold";
                content.innerHTML = `
                    <h2 class="text-md font-bold text-indigo-400 mb-4">👑 ဒိုင်ချုပ် ထိန်းချုပ်ရန်</h2>
                    <p class="text-sm text-slate-300">ကော်မရှင်များ ရိုက်ထည့်လိုက်သော စာရင်းများ အောက်ပါအတိုင်း Real-time ပေါ်လာပါမည်။</p>
                    <div id="liveBets" class="mt-4 overflow-x-auto"></div>
                `;
                loadMasterBets();
            } else {
                document.getElementById('btnAgent').className = "px-3 py-1 bg-emerald-600 rounded text-xs font-bold";
                document.getElementById('btnMaster').className = "px-3 py-1 bg-slate-700 rounded text-xs font-bold";
                content.innerHTML = `
                    <h2 class="text-md font-bold text-emerald-400 mb-4">✍️ ကော်မရှင် စာရင်းသွင်းရန်</h2>
                    <form onsubmit="submitBet(event)" class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400">ကော်မရှင် အမည်</label>
                            <input type="text" id="agentName" value="Agent_001" class="w-full mt-1 bg-slate-700 p-2 rounded text-sm border border-slate-600">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400">ဂဏန်း (ဥပမာ - 45)</label>
                            <input type="text" id="betNumber" maxlength="3" class="w-full mt-1 bg-slate-700 p-2 rounded text-lg font-mono border border-slate-600" required>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400">ထိုးကြေး (ကျပ်)</label>
                            <input type="number" id="betAmount" class="w-full mt-1 bg-slate-700 p-2 rounded text-lg font-mono border border-slate-600" required>
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded font-bold">ဘောက်ချာ ဖြတ်မည်</button>
                    </form>
                    <p id="msg" class="text-sm mt-2 text-center"></p>
                `;
            }
        }

        window.submitBet = function(e) {
            e.preventDefault();
            const agent = document.getElementById('agentName').value;
            const number = document.getElementById('betNumber').value;
            const amount = Number(document.getElementById('betAmount').value);

            db.collection('bets').add({
                agent,
                number,
                amount,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('msg').innerHTML = `<span class="text-emerald-400">✅ ဘောက်ချာ အောင်မြင်စွာ ဝင်ပါပြီ (${number})</span>`;
                document.getElementById('betNumber').value = '';
                document.getElementById('betAmount').value = '';
            }).catch(err => {
                document.getElementById('msg').innerHTML = `<span class="text-rose-400">❌ အမှားအယွင်း ရှိသည်</span>`;
            });
        }

        function loadMasterBets() {
            db.collection('bets').orderBy('timestamp', 'desc').onSnapshot(snapshot => {
                const container = document.getElementById('liveBets');
                if(!container) return;
                let html = `<table class="w-full text-left text-xs"><thead class="bg-slate-700"><tr><th class="p-2">Agent</th><th class="p-2">ဂဏန်း</th><th class="p-2">ပမာဏ</th></tr></thead><tbody>`;
                if(snapshot.empty) {
                    html += `<tr><td colspan="3" class="p-4 text-center text-slate-500">စာရင်း မရှိသေးပါ။</td></tr>`;
                } else {
                    snapshot.forEach(doc => {
                        const d = doc.data();
                        html += `<tr class="border-b border-slate-700"><td class="p-2">${d.agent}</td><td class="p-2 font-mono font-bold text-amber-400">${d.number}</td><td class="p-2 font-mono text-emerald-400">${d.amount} ကျပ်</td></tr>`;
                    });
                }
                html += `</tbody></table>`;
                container.innerHTML = html; 
            });
        }

        setRole('master');
    </script>
</body>
</html>
